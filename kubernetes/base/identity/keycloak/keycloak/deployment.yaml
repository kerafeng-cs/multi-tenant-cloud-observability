apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak

spec:
  # TODO-30 HA: two nodes clustered by Infinispan. In production mode
  # ("start") the cache is "ispn" and members find each other through the
  # shared database (default stack jdbc-ping, table JGROUPS_PING), so no
  # extra Service or RBAC is needed; members talk on 7800/57800 inside the
  # namespace (allowed by NetworkPolicy internal-only). Sessions are
  # replicated, so either pod can serve any login or token request.
  # TODO-34: replica count is owned by the HorizontalPodAutoscaler
  # (hpa.yaml, min 2 / max 3); a replicas field here would reset it
  # on every apply.

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      # One pod per node where possible: a node loss keeps one Keycloak.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: keycloak

      # Time to leave the cluster cleanly (hand over cache entries).
      terminationGracePeriodSeconds: 60

      # Start Keycloak only once its database answers: no CrashLoopBackOff
      # on a fresh install while the Postgres volume is being provisioned.
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -q -h keycloak-postgres -p 5432; do
                echo "waiting for keycloak-postgres..."
                sleep 2
              done

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3

          args:
            - start

          env:
            - name: KC_DB
              value: postgres

            - name: KC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: database

            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/$(KC_DB_NAME)

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password

            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password

            # TODO-04: one fixed public name. Tokens carry
            # iss = KC_HOSTNAME/realms/<realm> whichever address was used
            # to call Keycloak; in-cluster callers keep using
            # http://keycloak:8080 (backchannel dynamic).
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: KEYCLOAK_PUBLIC_URL

            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"

            # HTTP everywhere for now (mentor, 2026-10-15); TLS, if ever,
            # is terminated by the entry point in front of the cluster.
            - name: KC_HTTP_ENABLED
              value: "true"

            - name: KC_HEALTH_ENABLED
              value: "true"

            - name: KC_METRICS_ENABLED
              value: "true"

            # Latency histograms for the Platform/Benchmark dashboards.
            - name: KC_HTTP_METRICS_HISTOGRAMS_ENABLED
              value: "true"

            # Benchmark 2026-10-18: one pod served 333 tokens/s, then at
            # 600/s queued requests grew until the pod was OOMKilled and
            # every agent lost token renewal. Shed load instead: beyond
            # this queue Keycloak answers 503 and clients retry.
            - name: KC_HTTP_MAX_QUEUED_REQUESTS
              value: "1000"

            # Two pods share keycloak-postgres (max_connections 100):
            # 2 x 40 leaves room for the exporter and admin sessions.
            - name: KC_DB_POOL_MAX_SIZE
              value: "40"

            # Heap = 50% of the memory limit (default 70%): the rest is
            # for metaspace, threads and network buffers, which is what
            # ran out at 1 GiB.
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"

          ports:
            - name: http
              containerPort: 8080

            - name: management
              containerPort: 9000

            # Infinispan cluster transport and failure detection.
            - name: jgroups
              containerPort: 7800

            - name: jgroups-fd
              containerPort: 57800

          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10

          # Restart a pod that hangs (e.g. stuck in GC), but slowly: the
          # other pod keeps serving meanwhile.
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
