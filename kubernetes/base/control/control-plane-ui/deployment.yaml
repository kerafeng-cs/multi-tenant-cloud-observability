apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-ui
  labels:
    app: control-plane-ui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: control-plane-ui

  template:
    metadata:
      labels:
        app: control-plane-ui

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine

          # Public URLs for /config.js (see nginx.conf). Only these names are
          # substituted into the template.
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: "^(KEYCLOAK_PUBLIC_URL|GRAFANA_PUBLIC_URL|UI_PUBLIC_URL|MTCO_ENVIRONMENT)$"

            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: KEYCLOAK_PUBLIC_URL

            - name: GRAFANA_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: GRAFANA_PUBLIC_URL

            - name: UI_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: UI_PUBLIC_URL

            - name: MTCO_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: MTCO_ENVIRONMENT

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi

          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true

            # nginx.conf template (rendered at start-up into conf.d).
            - name: nginx-template
              mountPath: /etc/nginx/templates
              readOnly: true

            # Rendered config: writable, the root filesystem stays read-only.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d

            # pid file and proxy/client temp files of the unprivileged image.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: site
          configMap:
            name: control-plane-ui-site

        - name: nginx-template
          configMap:
            name: control-plane-ui-nginx

        - name: nginx-conf
          emptyDir: {}

        - name: tmp
          emptyDir: {}
