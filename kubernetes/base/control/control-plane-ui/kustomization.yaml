apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Control-plane web UI (TODO-01): plain ES modules served by stock nginx,
# no build step and no npm dependencies. ConfigMap names get a content
# hash, so every change of a file rolls the Deployment.

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: control-plane-ui-site
    files:
      - site/index.html
      - site/favicon.svg
      - site/styles.css
      - site/theme.js
      - site/app.js
      - site/api.js
      - site/auth.js
      - site/sha256.js
      - site/dom.js
      - site/router.js
      - site/session.js
      - site/ui.js
      - site/screens.js
      - site/page-home.js
      - site/page-tenants.js
      - site/page-tenant.js
      - site/page-support.js
      - site/page-sync.js
      - site/page-profile.js
      - site/tab-users.js
      - site/tab-agents.js
      - site/tab-enrollments.js
      - site/tab-support.js

  # nginx.conf is a template: /config.js is rendered from ConfigMap
  # platform-endpoints (TODO-04), so the UI hard-codes no URL.
  - name: control-plane-ui-nginx
    files:
      - default.conf.template=nginx.conf
