apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO-25: MTCO watches itself. Part of the product, installed with the
# rest of the platform. Everything here writes ONLY to the platform tenant
# (admin-tenant: VictoriaMetrics account 1, OpenSearch tenant.id
# admin-tenant), so only platform admins see it.
#
# - vmagent:           scrapes /metrics of the platform pods + per-pod
#                      CPU/RAM/network from the kubelet (cAdvisor)
# - postgres-exporter: the three PostgreSQL databases
# - log-collector:     logs of the pods of this namespace -> OpenSearch
# - dashboards:        "Platform health" in Grafana org 1 (provisioned)
#
# Each part waits for the core (VictoriaMetrics / OpenSearch / databases)
# before it starts: the install itself is not monitored. No alerting.
resources:
  - vmagent
  - postgres-exporter
  - log-collector
  - dashboards
