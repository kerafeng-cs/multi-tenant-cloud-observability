global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # /metrics that the platform components already expose. A pod is scraped
  # when its `app` label and the NAME of a declared container port match
  # (VictoriaMetrics of every data store: vminsert, vminsert-dedicated-1...):
  # no annotations on the workloads, no Service needed.
  - job_name: platform
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - observability

    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep

      - source_labels:
          - __meta_kubernetes_pod_label_app
          - __meta_kubernetes_pod_container_port_name
        regex: "((vminsert|vmselect|vmstorage)(-[a-z0-9-]+)?|vmagent|control-plane|query-gateway|grafana);http|keycloak;management|otel-gateway;telemetry|postgres-exporter;pg-.+"
        action: keep

      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      # postgres-exporter: one port per database (pg-control-plane...).
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: "pg-(.+)"
        target_label: database

  # Per-container CPU / memory / network of THIS namespace, from the
  # kubelet's cAdvisor through the API server proxy.
  - job_name: cadvisor
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    kubernetes_sd_configs:
      - role: node

    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443

      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

    metric_relabel_configs:
      - source_labels: [namespace]
        regex: observability
        action: keep

      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_reads_bytes_total|fs_writes_bytes_total|start_time_seconds)"
        action: keep
