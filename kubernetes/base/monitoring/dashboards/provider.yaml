apiVersion: 1

providers:
  - name: mtco-platform
    orgId: 1
    folder: Platform
    folderUid: mtco-platform
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
