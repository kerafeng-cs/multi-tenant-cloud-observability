apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vmselect

  template:
    metadata:
      labels:
        app: vmselect

    spec:
      containers:
        - name: vmselect
          image: victoriametrics/vmselect:v1.150.0-cluster

          args:
            - -storageNode=vmstorage-0.vmstorage:8401
            - -storageNode=vmstorage-1.vmstorage:8401

          ports:
            - name: http
              containerPort: 8481

          resources:
            # Benchmark 2026-10-17: 2 x 500m was the read-path ceiling (fully
            # used and throttled at 50 queries/s). 1 core per pod doubles it.
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vmselect
