apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert

spec:
  # TODO-34: replica count is owned by the HorizontalPodAutoscaler
  # (hpa.yaml, min 2 / max 4); a replicas field here would reset it
  # on every apply.

  selector:
    matchLabels:
      app: vminsert

  template:
    metadata:
      labels:
        app: vminsert

    spec:
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.150.0-cluster

          args:
            - -storageNode=vmstorage-0.vmstorage:8400
            - -storageNode=vmstorage-1.vmstorage:8400

          ports:
            - name: http
              containerPort: 8480

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # Benchmark 2026-10-21: vminsert + vmstorage used ~0.11 core in total
            # at 13,000 points/s; 300m per pod leaves room for ~4x that.
            limits:
              cpu: 300m
              memory: 384Mi

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vminsert
