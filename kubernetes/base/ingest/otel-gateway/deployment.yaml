apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: otel-gateway

  template:
    metadata:
      labels:
        app: otel-gateway

    spec:
      initContainers:
        # TODO-04 (I-06): keeps /jwks/jwks.json in sync with Keycloak's
        # signing keys over the IN-CLUSTER address (no DNS outside the
        # cluster needed). A native sidecar: the collector starts once the
        # first copy exists (startupProbe) and the oidc extension reloads
        # the file by itself whenever it changes (fsnotify), so a Keycloak
        # key rotation needs no restart. Only a changed, valid key set is
        # swapped in (atomic rename); a failed fetch keeps the old keys.
        - name: jwks-refresher
          image: busybox:1.37.0
          restartPolicy: Always

          env:
            - name: JWKS_URL
              value: http://keycloak:8080/realms/observability/protocol/openid-connect/certs

            - name: REFRESH_SECONDS
              value: "60"

          command:
            - /bin/sh
            - -c
            - |
              STAGING=/jwks/.staging
              mkdir -p "$STAGING"

              fetch() {
                wget -qO "$STAGING/jwks.json" "$JWKS_URL" \
                  && grep -q '"keys"' "$STAGING/jwks.json"
              }

              until fetch; do
                echo "Keycloak JWKS not ready yet..."
                sleep 2
              done

              mv -f "$STAGING/jwks.json" /jwks/jwks.json
              echo "Keycloak JWKS ready."

              while true; do
                sleep "$REFRESH_SECONDS"

                if ! fetch; then
                  echo "JWKS refresh failed; keeping the current keys"
                elif cmp -s "$STAGING/jwks.json" /jwks/jwks.json; then
                  rm -f "$STAGING/jwks.json"
                else
                  mv -f "$STAGING/jwks.json" /jwks/jwks.json
                  echo "Keycloak signing keys changed; JWKS updated"
                fi
              done

          startupProbe:
            exec:
              command: ["test", "-s", "/jwks/jwks.json"]
            periodSeconds: 2
            failureThreshold: 300

          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi

          volumeMounts:
            - name: keycloak-jwks
              mountPath: /jwks

      containers:
        - name: otel-gateway
          image: otel/opentelemetry-collector-contrib:0.160.0

          args:
            - --config=/etc/otelcol-contrib/config.yaml

          env:
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-ingest
                  key: username

            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-ingest
                  key: password

            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: platform-endpoints
                  key: KEYCLOAK_ISSUER

          ports:
            - name: otlp-http
              containerPort: 4318

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true

            - name: keycloak-jwks
              mountPath: /etc/otel/jwks
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: config
          configMap:
            name: otel-gateway-config

        - name: keycloak-jwks
          emptyDir: {}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: otel-gateway
