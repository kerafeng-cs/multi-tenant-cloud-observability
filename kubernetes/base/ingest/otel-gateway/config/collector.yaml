receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: oidc/agent

processors:
  # TODO-21: limits follow the container memory limit (deployment.yaml)
  # instead of fixed MiB, so resizing the pod needs no config change.
  # Refusing starts at 80% - 20% = 60% of the limit (agents get a
  # retryable 503), hard limit at 80%. Benchmark 2026-10-18: with a fixed
  # 400 MiB on a 512 MiB pod, logs topped out at ~5,000/s on RAM while CPU
  # was below half.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  resource/tenant:
    attributes:
      - key: tenant.id
        from_context: auth.claims.tenant_id
        action: upsert

      - key: agent.id
        from_context: auth.claims.agent_id
        action: upsert

      - key: vm.account.id
        from_context: auth.claims.vm_account_id
        action: upsert

  # Batches stay large: each OpenSearch bulk costs a roughly fixed
  # round trip + disk sync, so throughput ~ batch size. Benchmark
  # 2026-10-19: 1,000-2,000 per bulk dropped OpenSearch to ~4,200 logs/s
  # (queue 93% full), while ~8k batches kept up with 5,000/s on 10-18.
  # RAM is protected by the byte-bounded queue below, not by small
  # batches; the max only stops one batch from growing without limit.
  batch:
    send_batch_size: 8192
    send_batch_max_size: 10000
    timeout: 1s

extensions:
  basicauth/opensearch:
    client_auth:
      username: ${env:OPENSEARCH_USERNAME}
      password: ${env:OPENSEARCH_PASSWORD}

  oidc/agent:
    providers:
      - issuer_url: ${env:KEYCLOAK_ISSUER}
        audience: otel-gateway
        public_keys_file: /etc/otel/jwks/jwks.json

  headers_setter/victoriametrics:
    headers:
      - key: AccountID
        from_attribute: claims.vm_account_id
        action: upsert

exporters:
  prometheus_remote_write/victoriametrics:
    endpoint: http://vminsert:8480/insert/prometheus/api/v1/write

    resource_constant_labels:
      included:
        - tenant.id
        - agent.id
        - host.name
        - host.arch
        - os.type

    auth:
      authenticator: headers_setter/victoriametrics

  opensearch:
    http:
      endpoint: https://opensearch:9200
      auth:
        authenticator: basicauth/opensearch
      tls:
        insecure_skip_verify: true

    # One data stream per tenant (template otel-logs-* + ISM policy from
    # the OpenSearch bootstrap Job). tenant.id is the resource attribute
    # set from the token by processor resource/tenant, never by the agent.
    # Data streams only accept "create". Readers keep using otel-logs*,
    # which also covers the legacy otel-logs index.
    logs_index: "otel-logs-%{tenant.id}"
    # Never used in practice (tenant.id is always set); the underscore
    # cannot appear in a tenant key, so this can never be a tenant's stream.
    logs_index_fallback: no_tenant
    bulk_action: create

    # Benchmark 2026-10-17: without a queue the agent's request waited for
    # the OpenSearch bulk (p99 ~2.4 s), so agents slowed down with storage.
    # The queue answers the agent at once and absorbs slow or failed bulks
    # (retried with backoff); 4 bulks in flight. In memory: a restart drops
    # what is still queued (persistent queue = TODO-21).
    # TODO-21: the queue is bounded in BYTES (128 MiB per pod, ~13% of the
    # 1 GiB limit), not in batches whose size varies; when it is full the
    # agent gets a retryable error instead of the pod running out of RAM.
    # 2 bulks in flight per pod (3 pods = 6): benchmark 2026-10-19 showed
    # ~11 concurrent bulks only made each one wait longer in OpenSearch
    # (0.5 s -> 4 s) without writing more (Little's law).
    sending_queue:
      enabled: true
      num_consumers: 2
      sizer: bytes
      queue_size: 134217728

    retry_on_failure:
      enabled: true
      max_elapsed_time: 5m

service:
  # TODO-25: own metrics (accepted/refused/sent/failed per receiver and
  # exporter, queue size, HTTP server latency) for vmagent. "detailed"
  # adds the per-request HTTP histograms used by the benchmark report.
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  extensions:
    - basicauth/opensearch
    - oidc/agent
    - headers_setter/victoriametrics

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant]
      exporters: [prometheus_remote_write/victoriametrics]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, batch]
      exporters: [opensearch]
