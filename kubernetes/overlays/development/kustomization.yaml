apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - ../../base/foundation
  - ../../base/storage/victoriametrics
  - ../../base/storage/opensearch
  - ../../base/storage/catalog
  - ../../base/ingest/otel-gateway
  - ../../base/identity/keycloak
  - ../../base/query
  - ../../base/control/control-plane
  - ../../base/control/control-plane-ui
  - ../../base/control/control-plane-db
  - ../../base/monitoring
  # TODO-28 phase B: dedicated cell (1:1) of this lab
  - cells/dedicated-1

secretGenerator:
  - name: opensearch-bootstrap
    envs:
      - secrets.env

  - name: opensearch-ingest
    envs:
      - opensearch-ingest.env

  - name: opensearch-query
    envs:
      - opensearch-query.env

  # TODO-15: control-plane's account for the per-tenant read roles
  # (same account in every logs store).
  - name: opensearch-security
    envs:
      - opensearch-security.env

  - name: keycloak-db
    envs:
      - keycloak-db.env

  - name: keycloak-admin
    envs:
      - keycloak-admin.env

  - name: grafana-admin
    envs:
      - grafana-admin.env

  - name: grafana-oidc
    envs:
      - grafana-oidc.env

  - name: grafana-db
    envs:
      - grafana-db.env

  - name: control-plane-keycloak
    envs:
      - control-plane-keycloak.env

  - name: control-plane-db
    envs:
      - control-plane-db.env

  - name: platform-admin
    envs:
      - platform-admin.env

configMapGenerator:
  # TODO-28 phase B: this environment's data stores = shared + dedicated-1
  # (replaces the base catalog, which knows only "shared").
  - name: data-stores
    behavior: replace
    files:
      - stores.json

  # ...and how otel-gateway writes to them: a second config file merged
  # over the base one (see the patch of the otel-gateway Deployment).
  - name: otel-gateway-config
    behavior: merge
    files:
      - stores.yaml=otel-gateway-stores.yaml

  # TODO-04: the ONLY place that knows this environment's public URLs.
  # Clients outside the cluster (browsers, agents) reach them through the
  # enterprise DNS + entry point (the mentor's ingress/LB; environment/lab
  # simulates them). Inside the cluster everything uses Service names.
  # HTTP for now (mentor, 2026-10-15); changing scheme or names = changing
  # the issuer = fresh install.
  - name: platform-endpoints
    literals:
      - MTCO_ENVIRONMENT=development
      - KEYCLOAK_PUBLIC_URL=http://keycloak.mtco.test
      - KEYCLOAK_ISSUER=http://keycloak.mtco.test/realms/observability
      - GRAFANA_PUBLIC_URL=http://grafana.mtco.test
      - UI_PUBLIC_URL=http://mtco.test
      - OTEL_GATEWAY_PUBLIC_URL=http://otel.mtco.test

images:
  - name: query-gateway
    newName: kerafeng/query-gateway
    newTag: v0.1.17

  - name: control-plane
    newName: kerafeng/control-plane
    newTag: v0.13.0

patches:
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path

  # TODO-28 phase B: otel-gateway loads the overlay's stores on top of the
  # base config (same ConfigMap, second key).
  - target:
      kind: Deployment
      name: otel-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --config=/etc/otelcol-contrib/stores.yaml
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: config
          mountPath: /etc/otelcol-contrib/stores.yaml
          subPath: stores.yaml
          readOnly: true

  # ...and the dedicated cell's pods are internal like the shared stores.
  - target:
      kind: NetworkPolicy
      name: internal-only
    patch: |-
      - op: add
        path: /spec/podSelector/matchExpressions/0/values/-
        value: vminsert-dedicated-1
      - op: add
        path: /spec/podSelector/matchExpressions/0/values/-
        value: vmselect-dedicated-1
      - op: add
        path: /spec/podSelector/matchExpressions/0/values/-
        value: vmstorage-dedicated-1
      - op: add
        path: /spec/podSelector/matchExpressions/0/values/-
        value: opensearch-dedicated-1
