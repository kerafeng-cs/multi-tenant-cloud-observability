# Logs store "dedicated-1": a single-node OpenSearch with the same image,
# security plugin and TLS setup as the shared one. Its own cluster name,
# certificate (opensearch-dedicated-1-tls) and data; the admin password
# Secret is shared. Single node: no replicas (bootstrap Job sets the
# otel-logs-* template to 1 shard / 0 replicas), so health stays green.
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dedicated-1

spec:
  selector:
    app: opensearch-dedicated-1

  ports:
    - name: https
      port: 9200
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dedicated-1-headless

spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app: opensearch-dedicated-1

  ports:
    - name: transport
      port: 9300
      targetPort: transport
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-dedicated-1

spec:
  serviceName: opensearch-dedicated-1-headless
  replicas: 1

  selector:
    matchLabels:
      app: opensearch-dedicated-1

  template:
    metadata:
      labels:
        app: opensearch-dedicated-1

    spec:
      securityContext:
        fsGroup: 1000

      # OpenSearch requires vm.max_map_count >= 262144.
      initContainers:
        - name: set-vm-max-map-count
          image: busybox:1.36
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true

      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.8.0

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: cluster.name
              value: mtco-dedicated-1

            - name: node.name
              value: $(POD_NAME)

            - name: network.host
              value: "0.0.0.0"

            - name: discovery.type
              value: single-node

            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-bootstrap
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD

            - name: plugins.security.ssl.http.enabled
              value: "true"

            - name: plugins.security.ssl.http.pemcert_filepath
              value: certs/tls.crt

            - name: plugins.security.ssl.http.pemkey_filepath
              value: certs/tls.key

            - name: plugins.security.ssl.http.pemtrustedcas_filepath
              value: certs/ca.crt

            - name: plugins.security.ssl.http.clientauth_mode
              value: OPTIONAL

          ports:
            - name: http
              containerPort: 9200

            - name: transport
              containerPort: 9300

            - name: performance
              containerPort: 9600

          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

            - name: tls
              mountPath: /usr/share/opensearch/config/certs
              readOnly: true

          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

      volumes:
        - name: tls
          secret:
            secretName: opensearch-dedicated-1-tls

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        # storageClassName: set by the overlay, like the shared stores.

        resources:
          requests:
            storage: 5Gi
