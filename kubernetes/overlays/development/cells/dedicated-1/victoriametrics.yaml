# Metrics store "dedicated-1": a one-of-each VictoriaMetrics cluster, the
# same images and API as the shared one (otel-gateway writes to vminsert
# /insert/<AccountID>/..., query-gateway reads vmselect
# /select/<AccountID>/...). Tenants still get their own AccountID here.
# Sizes: 1:1 for one tenant in an 8-CPU lab cluster.
apiVersion: v1
kind: Service
metadata:
  name: vmstorage-dedicated-1

spec:
  clusterIP: None

  selector:
    app: vmstorage-dedicated-1

  ports:
    - name: vminsert
      port: 8400
      targetPort: vminsert

    - name: vmselect
      port: 8401
      targetPort: vmselect

    - name: http
      port: 8482
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage-dedicated-1

spec:
  serviceName: vmstorage-dedicated-1
  replicas: 1

  selector:
    matchLabels:
      app: vmstorage-dedicated-1

  template:
    metadata:
      labels:
        app: vmstorage-dedicated-1

    spec:
      containers:
        - name: vmstorage
          image: victoriametrics/vmstorage:v1.150.0-cluster

          args:
            - -storageDataPath=/vmstorage-data

          ports:
            - name: vminsert
              containerPort: 8400

            - name: vmselect
              containerPort: 8401

            - name: http
              containerPort: 8482

          volumeMounts:
            - name: data
              mountPath: /vmstorage-data

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        # storageClassName: set by the overlay, like the shared stores.

        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vminsert-dedicated-1

spec:
  selector:
    app: vminsert-dedicated-1

  ports:
    - name: http
      port: 8480
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert-dedicated-1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vminsert-dedicated-1

  template:
    metadata:
      labels:
        app: vminsert-dedicated-1

    spec:
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.150.0-cluster

          args:
            - -storageNode=vmstorage-dedicated-1-0.vmstorage-dedicated-1:8400

          ports:
            - name: http
              containerPort: 8480

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vmselect-dedicated-1

spec:
  selector:
    app: vmselect-dedicated-1

  ports:
    - name: http
      port: 8481
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect-dedicated-1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vmselect-dedicated-1

  template:
    metadata:
      labels:
        app: vmselect-dedicated-1

    spec:
      containers:
        - name: vmselect
          image: victoriametrics/vmselect:v1.150.0-cluster

          args:
            - -storageNode=vmstorage-dedicated-1-0.vmstorage-dedicated-1:8401

          ports:
            - name: http
              containerPort: 8481

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
