# Lab entry point: routes by host name, like the enterprise ingress would.
# Upstreams are resolved when nginx starts: apply the product first.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 120s;
client_max_body_size 32m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name keycloak.mtco.test;

    location / {
        proxy_pass http://keycloak.observability.svc.cluster.local:8080;
    }
}

server {
    listen 8080;
    server_name grafana.mtco.test;

    location / {
        # A location that sets any proxy_set_header inherits none from
        # above, so the common ones are repeated here.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana.observability.svc.cluster.local:3000;
    }
}

server {
    listen 8080;
    server_name mtco.test;

    location / {
        proxy_pass http://control-plane-ui.observability.svc.cluster.local:8080;
    }
}

server {
    listen 8080;
    server_name otel.mtco.test;

    location / {
        proxy_pass http://otel-gateway.observability.svc.cluster.local:4318;
    }
}
